name: RetinopatiaApp CI

on: [push]

jobs:

  build:

    runs-on: windows-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyqt5
          pip install torch
          pip install onnxruntime
          pip install pillow
          pip install numpy

      - name: Check files
        run: dir

      - name: Run inference test
        run: python infer_torch.py
